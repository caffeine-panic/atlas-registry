name: v0.6.2 Nacos 2.5.2 compatibility fallback

on:
  push:
    branches: [feature/release-v062-nacos-check]

permissions:
  contents: read

jobs:
  nacos:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: 7eec221e252f609fe393f45bf8a2047a9151d98b

      - name: Verify tested release commit
        run: test "$(git rev-parse HEAD)" = 7eec221e252f609fe393f45bf8a2047a9151d98b

      - name: Install test dependencies
        run: |
          sudo timeout 120s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
          sudo timeout 150s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev protobuf-compiler

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          workspaces: src-tauri -> target

      - name: Run the v0.6.2 Nacos 2.5.2 real-service contract
        run: ./scripts/compatibility-test.sh nacos 2.5.2 v2
