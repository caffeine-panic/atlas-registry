name: Quality and desktop build

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  desktop:
    name: macOS Apple Silicon
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64

      - name: Install macOS protobuf compiler
        run: brew install protobuf

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Lint Rust targets
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Clear generated TypeScript contracts
        run: node scripts/clear-generated-contracts.mjs

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --quiet

      - name: Verify generated TypeScript contracts are current
        run: node scripts/verify-generated-contracts.mjs

      - name: Build frontend
        run: npm run build

      - name: Lint frontend
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test frontend behavior
        run: npm run test:ui

      - name: Configure ad-hoc macOS signing for CI bundles
        shell: bash
        run: echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"

      - name: Build macOS install bundles
        run: npm run tauri build -- --target aarch64-apple-darwin --bundles app,dmg --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Verify and install macOS bundles
        shell: bash
        run: |
          set -Eeuo pipefail
          app="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -name '*.app' -type d -print -quit)"
          dmg="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -type f -print -quit)"
          test -n "$app"
          test -n "$dmg"
          executable="$(plutil -extract CFBundleExecutable raw "$app/Contents/Info.plist")"
          test "$(lipo -archs "$app/Contents/MacOS/$executable")" = arm64
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --deep --verbose=4 "$app"
          hdiutil verify "$dmg"
          installed="$RUNNER_TEMP/Applications/Atlas Registry.app"
          mkdir -p "$(dirname "$installed")"
          ditto "$app" "$installed"
          test "$(plutil -extract CFBundleIdentifier raw "$installed/Contents/Info.plist")" = "dev.oneaday.atlas-registry"
          codesign --verify --deep --strict --verbose=2 "$installed"
          shasum -a 256 "$dmg"
